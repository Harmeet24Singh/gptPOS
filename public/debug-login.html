<!DOCTYPE html>
<html>
<head>
    <title>Debug Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        input, button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Login Debug Tool</h1>
    
    <div class="section">
        <h2>Test Credentials</h2>
        <p>Try these users:</p>
        <ul>
            <li><strong>admin</strong> / admin123</li>
            <li><strong>harmeet24singh@gmail.com</strong> / Canada.1</li>
            <li><strong>manish@m.com</strong> / 123456</li>
        </ul>
    </div>
    
    <div class="section">
        <h2>Login Test</h2>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="section">
        <h2>Current Auth State</h2>
        <button onclick="checkCurrentUser()">Check Current User</button>
        <button onclick="clearStorage()">Clear Storage</button>
        <div id="authState"></div>
    </div>
    
    <div class="section">
        <h2>API Tests</h2>
        <button onclick="testAuthAPI()">Test Auth API</button>
        <button onclick="testUsersAPI()">Test Users API</button>
        <div id="apiResults"></div>
    </div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('loginResult');
            
            result.innerHTML = 'Testing login...';
            
            try {
                // Simulate the auth.login() function logic
                const res = await fetch('/api/users');
                if (res.ok) {
                    const list = await res.json();
                    const found = list.find((u) => {
                        const userMatch = (u.username || u.id || '').toLowerCase() === username.toLowerCase();
                        const passMatch = (u.password || u.pwd || '') === password;
                        return userMatch && passMatch;
                    });
                    
                    if (found) {
                        localStorage.setItem('currentUser', JSON.stringify(found));
                        result.innerHTML = `<div class="success">✅ Login successful! User: ${found.username || found.id}</div>`;
                        checkCurrentUser();
                    } else {
                        result.innerHTML = `<div class="error">❌ Login failed: Invalid credentials</div>`;
                    }
                } else {
                    result.innerHTML = `<div class="error">❌ Failed to fetch users: ${res.status}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function checkCurrentUser() {
            const authState = document.getElementById('authState');
            const currentUser = localStorage.getItem('currentUser');
            
            if (currentUser) {
                const user = JSON.parse(currentUser);
                authState.innerHTML = `<div class="success">Current user: <pre>${JSON.stringify(user, null, 2)}</pre></div>`;
            } else {
                authState.innerHTML = `<div class="error">No user logged in</div>`;
            }
        }
        
        function clearStorage() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('users');
            document.getElementById('authState').innerHTML = '<div>Storage cleared</div>';
        }
        
        async function testAuthAPI() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('apiResults');
            
            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                result.innerHTML = `<div class="${response.ok ? 'success' : 'error'}">
                    Auth API (${response.status}): <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>`;
            } catch (error) {
                result.innerHTML = `<div class="error">Auth API Error: ${error.message}</div>`;
            }
        }
        
        async function testUsersAPI() {
            const result = document.getElementById('apiResults');
            
            try {
                const response = await fetch('/api/users');
                const data = await response.json();
                result.innerHTML = `<div class="success">
                    Users API (${response.status}): Found ${data.length} users
                    <pre>${JSON.stringify(data.map(u => ({
                        username: u.username || u.id,
                        role: u.role,
                        hasPassword: !!(u.password || u.pwd)
                    })), null, 2)}</pre>
                </div>`;
            } catch (error) {
                result.innerHTML = `<div class="error">Users API Error: ${error.message}</div>`;
            }
        }
        
        // Check current state on page load
        checkCurrentUser();
    </script>
</body>
</html>
